<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALAX GPS - Asientos Contables</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden transition-colors">
  
  <div id="app-aside"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-end px-4 md:px-6 shrink-0 relative">
      <div class="md:hidden w-10"></div>
      <button id="btnActualizarHeader" class="p-2.5 hover:bg-slate-800 text-slate-400 hover:text-white rounded-xl transition-colors" title="Actualizar"><i class="fa-solid fa-rotate text-sm"></i></button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 bg-slate-950/40">
      
      <!-- Filtros -->
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-book-bookmark text-amber-500"></i> Asientos Contables (Maestro)
          </h2>
          <span id="contadorRegistros" class="text-xs font-mono bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20">Asientos : 0</span>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 text-xs">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscador :</label>
            <input type="text" id="inputBuscador" placeholder="Escriba para filtrar..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Buscar en :</label>
            <select id="filtroCampo" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200">
              <option value="codigo">CODIGO</option>
              <option value="concepto">CONCEPTO</option>
              <option value="estatus">ESTATUS</option>
            </select>
          </div>
        </div>
      </div>

      <!-- Tabla -->
      <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[320px]">
        <div class="flex-1 overflow-auto">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
              <tr>
                <th class="p-3.5 border-r border-slate-800/50">ID</th>
                <th class="p-3.5 border-r border-slate-800/50">CODIGO</th>
                <th class="p-3.5 border-r border-slate-800/50">FECHA</th>
                <th class="p-3.5 border-r border-slate-800/50">CONCEPTO</th>
                <th class="p-3.5 border-r border-slate-800/50">DEBITO</th>
                <th class="p-3.5 border-r border-slate-800/50">CREDITO</th>
                <th class="p-3.5">ESTATUS</th>
              </tr>
            </thead>
            <tbody id="tablaAsientosBody" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>

        <div class="p-3 bg-slate-900 border-t border-slate-800 flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button id="btnAbrirAgregar" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-semibold text-xs transition-all flex items-center gap-2 shadow-lg shadow-amber-600/20"><i class="fa-solid fa-plus"></i> Agregar</button>
            <button id="btnAbrirEditar" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700"><i class="fa-solid fa-pen-to-square"></i> Editar</button>
            <button id="btnEliminarAsiento" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-rose-400 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700"><i class="fa-solid fa-trash"></i> Eliminar</button>
          </div>
          <button id="btnExportarCsv" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700">
            <i class="fa-solid fa-file-excel"></i> Exportar a Excel
          </button>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Registrar / Editar Asiento -->
  <div id="modalAsiento" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl flex flex-col text-xs space-y-4">
      <div class="flex items-center justify-between border-b border-slate-800 pb-3">
        <h3 id="modalTitulo" class="font-bold text-white text-sm flex items-center gap-2">
          <i class="fa-solid fa-plus-circle text-amber-500"></i> Registrar Asiento Contable
        </h3>
        <button id="btnCerrarModal" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>

      <form id="formAsiento" class="space-y-3">
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Código / Lote :</label>
            <input type="text" id="asientoCodigo" required placeholder="Ej: 2026254" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono font-bold">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Fecha :</label>
            <input type="date" id="asientoFecha" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Concepto :</label>
          <input type="text" id="asientoConcepto" required placeholder="Ej: COBRO FACT-3184" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 uppercase font-bold">
        </div>
        <div class="grid grid-cols-2 gap-3">
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Débito :</label>
            <input type="number" step="0.01" id="asientoDebito" value="0.00" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
          <div>
            <label class="block text-slate-400 mb-1 font-semibold">Crédito :</label>
            <input type="number" step="0.01" id="asientoCredito" value="0.00" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-mono">
          </div>
        </div>
        <div>
          <label class="block text-slate-400 mb-1 font-semibold">Estatus :</label>
          <select id="asientoEstatus" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-slate-200 font-bold">
            <option value="ACTIVO">ACTIVO</option>
            <option value="INACTIVO">INACTIVO</option>
          </select>
        </div>

        <div class="flex justify-end gap-2 pt-3 border-t border-slate-800">
          <button type="button" id="btnCancelarModal" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl">Cancelar</button>
          <button type="submit" class="px-5 py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-xl font-bold shadow-lg shadow-amber-600/20">Guardar Asiento</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal de Confirmación para Eliminar -->
  <div id="modalEliminar" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
      <div class="w-12 h-12 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-2xl flex items-center justify-center mx-auto text-xl">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <div>
        <h3 class="font-bold text-white text-sm">GalaxGPS - Confirmar Eliminación</h3>
        <p id="textoEliminarModal" class="text-xs text-slate-400 mt-1">¿Seguro que deseas eliminar este asiento?</p>
      </div>
      <div class="flex items-center gap-2 pt-2">
        <button id="btnCancelarEliminar" class="w-1/2 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl text-xs font-bold">Cancelar</button>
        <button id="btnConfirmarEliminar" class="w-1/2 py-2.5 bg-rose-600 hover:bg-rose-700 text-white rounded-xl text-xs font-bold shadow-lg shadow-rose-600/20">Sí, eliminar</button>
      </div>
    </div>
  </div>

  <!-- Modal Alerta genérica -->
  <div id="modalAlerta" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center space-y-4">
      <p id="textoAlertaModal" class="text-xs text-slate-300">Aviso</p>
      <button id="btnCerrarAlerta" class="w-full py-2 bg-amber-600 text-white rounded-xl text-xs font-bold">Aceptar</button>
    </div>
  </div>

  <script type="module">
    import { renderAside } from '../../../js/components/aside.js';
    renderAside('contabilidad');
  </script>
  <script type="module" src="../../../js/contabilidad/asientos_contables.js"></script>
</body>
</html>
