<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GALAX GPS - Pagos Registrados</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="../../../css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 flex h-screen overflow-hidden transition-colors">
  
  <div id="app-aside"></div>

  <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
    <header class="h-16 bg-slate-900 border-b border-slate-800 flex items-center justify-end px-4 md:px-6 shrink-0 relative">
      <div class="md:hidden w-10"></div>
      <button id="btnActualizarHeader" class="p-2.5 hover:bg-slate-800 text-slate-400 hover:text-white rounded-xl transition-colors" title="Actualizar"><i class="fa-solid fa-rotate text-sm"></i></button>
    </header>

    <main class="flex-1 overflow-y-auto p-4 md:p-6 flex flex-col gap-4 bg-slate-950/40">
      
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-lg flex flex-col gap-4">
        <div class="flex items-center justify-between border-b border-slate-800 pb-3">
          <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 flex items-center gap-2">
            <i class="fa-solid fa-credit-card text-amber-500"></i> Pagos Registrados
          </h2>
          <div class="flex items-center gap-3">
            <button id="btnExportarPagosCsv" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-emerald-400 rounded-xl font-semibold text-xs transition-all flex items-center gap-2 border border-slate-700"><i class="fa-solid fa-file-excel"></i> Exportar a Excel</button>
            <span id="contadorPagos" class="text-xs font-mono bg-amber-500/10 text-amber-400 px-2.5 py-1 rounded-lg border border-amber-500/20">Cant : 0</span>
          </div>
        </div>
      </div>

      <div class="flex-1 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl overflow-hidden flex flex-col min-h-[320px]">
        <div class="flex-1 overflow-auto">
          <table class="w-full text-left text-xs whitespace-nowrap">
            <thead class="bg-slate-950 text-slate-400 uppercase font-semibold sticky top-0 border-b border-slate-800 z-10">
              <tr>
                <th class="p-3.5 border-r border-slate-800/50">SECUENCIA</th>
                <th class="p-3.5 border-r border-slate-800/50">CLIENTE</th>
                <th class="p-3.5 border-r border-slate-800/50">FACTURA ID</th>
                <th class="p-3.5 border-r border-slate-800/50">FECHA PAGO</th>
                <th class="p-3.5 border-r border-slate-800/50">TIPO PAGO</th>
                <th class="p-3.5 border-r border-slate-800/50">MONTO BS</th>
                <th class="p-3.5 border-r border-slate-800/50">REF USD</th>
                <th class="p-3.5 border-r border-slate-800/50">REFERENCIA</th>
                <th class="p-3.5">OBSERVACIÓN</th>
              </tr>
            </thead>
            <tbody id="tablaPagosBody" class="divide-y divide-slate-800/60"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { renderAside } from '../../../js/components/aside.js';
    renderAside('facturacion');
  </script>
  <script type="module" src="../../../js/facturacion/pagos.js"></script>
</body>
</html>
